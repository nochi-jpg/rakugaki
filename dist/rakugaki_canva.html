<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>らくがき学習バトル</title>
<style>
/* らくがき学習バトル：白黒の 手書き風。色が付くのは モンスターだけ */
:root{
  --hand:'しねきゃぷしょん','cinecaption','Yomogi','Hiragino Maru Gothic ProN','BIZ UDPGothic','Meiryo',sans-serif;
  --kyo:'UD デジタル 教科書体 N-B','UD Digi Kyokasho N-B','UD デジタル 教科書体 NK-B','Klee One','Hiragino Maru Gothic ProN','BIZ UDPGothic','Meiryo',sans-serif;
  --ink:#111; --wob:255px 18px 225px 18px/18px 225px 18px 255px; --wob2:18px 225px 18px 255px/255px 18px 225px 18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;color:var(--ink);font-family:var(--hand);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none;position:fixed;inset:0}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#fff;font-size:26px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.hide{display:none!important}
.box,.btn{border:3px solid var(--ink);border-radius:var(--wob);background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:150px;height:60px;padding:0 22px;font-size:26px;white-space:nowrap;
  box-shadow:3px 4px 0 var(--ink);transition:transform .05s}
.btn:nth-child(even){border-radius:var(--wob2)}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.strong{background:var(--ink);color:#fff;box-shadow:3px 4px 0 #888}
.btn.big{height:84px;font-size:34px;min-width:300px}
.btn.off{opacity:.3;pointer-events:none}
.btn.on{background:var(--ink);color:#fff}
.row{display:flex;gap:16px;align-items:center}.row.c{justify-content:center}
.col{display:flex;flex-direction:column;gap:14px}.col.c{align-items:center}
.note{font-size:20px;color:#555}
.ttl{position:absolute;left:0;right:0;top:18px;text-align:center;font-size:44px;font-weight:normal;pointer-events:none}
.backbtn{position:absolute;left:24px;top:20px;min-width:130px;height:54px;font-size:24px}
.ver{position:absolute;right:16px;bottom:10px;font-size:18px;color:#777}
.donebtn{position:absolute;right:24px;bottom:20px;width:300px;height:76px;font-size:34px}
.okbtn{position:absolute;right:40px;bottom:28px;width:300px;height:76px;font-size:32px}

/* えふでちゃん と ふきだし */
.efude{width:74px;height:90px;flex:none}
.guide{position:absolute;left:180px;top:14px;width:920px;height:104px;display:flex;align-items:center;gap:14px}
.bubble{flex:1;min-height:72px;max-height:100px;padding:8px 22px;font-size:25px;line-height:1.3;display:flex;align-items:center;overflow:hidden}

/* まど */
.modal{position:absolute;inset:0;background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;z-index:50}
.mbox{max-width:900px;min-width:520px;padding:30px 36px;display:flex;flex-direction:column;gap:20px;align-items:center;box-shadow:5px 6px 0 var(--ink)}
.mtext{font-size:30px;text-align:center;line-height:1.5}.mtext.s{font-size:26px}
.pngview{width:640px;height:360px;object-fit:contain;border:2px dashed #999;background:repeating-conic-gradient(#e4e4e8 0 25%,#fff 0 50%) 0 0/24px 24px;-webkit-touch-callout:default}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);padding:12px 30px;font-size:26px;z-index:60;box-shadow:3px 4px 0 var(--ink);white-space:nowrap}

/* タイトル */
.tlogo{position:absolute;left:0;right:0;top:110px;display:flex;flex-direction:column;align-items:center;gap:14px}
.tl1{font-size:120px;padding:4px 60px;line-height:1.25;box-shadow:6px 7px 0 var(--ink)}
.tl2{font-size:56px;letter-spacing:.12em}
.tbtns{position:absolute;left:0;right:0;top:450px}

/* かな入力 */
.namebox{position:absolute;left:300px;top:128px;width:680px;height:86px;display:flex;align-items:center;justify-content:center;gap:10px}
.namebox input{width:100%;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:54px;text-align:center;letter-spacing:.18em;color:var(--ink);-webkit-user-select:text;user-select:text;caret-color:var(--ink);padding:0 20px}
.namebox:focus-within{box-shadow:4px 5px 0 var(--ink)}
.kana{position:absolute;left:160px;top:232px;width:960px;display:grid;grid-template-columns:repeat(10,1fr);gap:10px 8px}
.kana i{height:62px}
.btn.k{min-width:0;height:62px;padding:0;font-size:34px;box-shadow:2px 3px 0 var(--ink)}
.kctl{position:absolute;left:40px;bottom:28px;gap:12px}
.kctl .btn{min-width:124px;height:76px;padding:0 14px}

/* がくねん・むき・からだ */
.grades{position:absolute;left:190px;top:210px;width:900px;display:grid;grid-template-columns:repeat(3,1fr);gap:40px 30px}
.btn.g{min-width:0;height:150px;font-size:44px}
.faces{position:absolute;left:140px;top:220px;width:1000px;display:flex;gap:60px;justify-content:center}
.btn.fc{width:440px;height:340px;flex-direction:column;font-size:44px;font-weight:normal}
.arrow{font-size:150px;line-height:1}
.shapes{position:absolute;left:90px;top:170px;width:1100px;display:grid;grid-template-columns:repeat(4,1fr);gap:30px}
.shp{height:220px;min-width:0;flex-direction:column;font-size:36px;font-weight:normal}
.shp.locked,.card.locked{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-style:dashed;color:#888;border-color:#999}
.shp b,.card b{font-weight:normal}.shp span,.card.locked span{font-size:20px}

/* ホーム */
.hname{position:absolute;left:30px;top:24px;padding:8px 26px;font-size:30px}
.hcoin{position:absolute;right:30px;top:24px;padding:8px 26px;font-size:30px;min-width:240px;text-align:center}
.hbig{position:absolute;left:80px;top:140px;width:1120px;display:flex;gap:60px}
.btn.huge{flex:1;height:330px;flex-direction:column;font-size:52px;box-shadow:6px 7px 0 var(--ink)}
.btn.huge b{font-weight:normal}.btn.huge span{font-size:24px;color:#777}
.hsmall{position:absolute;left:80px;top:540px;width:1120px;display:grid;grid-template-columns:repeat(4,1fr);gap:40px}
.hsmall .btn{min-width:0;height:110px;font-size:34px}

/* キャラクター */
.cards{position:absolute;left:50px;top:100px;width:1180px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px 26px}
.card{height:250px;min-width:0;padding:6px;flex-direction:column;gap:2px;font-size:30px}
.card canvas{width:340px;height:190px}
.card.empty{border-style:dashed}.plus{font-size:90px;line-height:1}
.foot{position:absolute;left:0;right:0;bottom:18px}
.dprev{position:absolute;left:40px;top:128px;width:600px;height:480px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:#fff}
.scr-detail .dprev{top:104px}
.dinfo{position:absolute;left:680px;top:128px;width:560px;display:flex;flex-direction:column;gap:12px;font-size:26px}
.scr-detail .dinfo{top:104px}
.dinfo h2{font-size:52px;font-weight:normal;line-height:1.1}
.stats{display:flex;flex-direction:column;gap:9px;margin:8px 0}
.st{display:flex;align-items:center;gap:12px;height:38px}
.st span{width:150px;font-size:26px}.st i{flex:1;height:26px;border:3px solid var(--ink);border-radius:var(--wob)}
.st em{display:block;height:100%;background:repeating-linear-gradient(-55deg,#111 0 3px,#fff 3px 7px)}
.st b{width:70px;text-align:right;font-weight:normal}
.dbtns{display:flex;gap:14px;margin-top:8px}.dbtns .btn{flex:1;min-width:0;padding:0 8px}

/* おえかき */
.dhead{position:absolute;left:12px;top:6px;width:1256px;height:66px;display:flex;align-items:center;gap:12px}
.dhead .efude{width:50px;height:60px}
.dhead .bubble{min-height:58px;max-height:62px;font-size:19px;line-height:1.3;padding:3px 16px}
.dhead .btn{min-width:110px;height:52px;font-size:22px}
.dir{flex:none;width:200px;height:52px;display:flex;align-items:center;justify-content:center;font-size:24px}
.tools{position:absolute;left:12px;top:80px;width:240px;overflow:hidden;height:628px;padding:10px 10px;display:flex;flex-direction:column;gap:9px;border-radius:14px 22px 16px 20px}
.trow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.trow.two{grid-template-columns:repeat(2,1fr)}
.btn.t{min-width:0;height:64px;padding:0 1px;font-size:14px;letter-spacing:-.04em;flex-direction:column;box-shadow:2px 3px 0 var(--ink);border-width:2.5px;gap:3px}
.ic{width:26px;height:26px;flex:none}
.btn.t.sz{gap:2px}.btn.t.sz i{flex:none}.btn.t.sz i{background:currentColor;border-radius:50%}
.btn.t.wide{font-size:22px;height:56px;padding:0 14px;letter-spacing:0;flex-direction:row;gap:8px}
.pal{display:grid;gap:5px}.pal.simple{grid-template-columns:repeat(4,1fr)}.pal.pro{grid-template-columns:repeat(6,1fr);grid-auto-flow:column;grid-template-rows:repeat(8,1fr);gap:3px}
.sw{height:50px;border:2.5px solid var(--ink);border-radius:12px 16px 12px 15px}
.pal.pro .sw{height:32px;border-width:1.5px;border-radius:6px}
.sw.on{outline:4px solid var(--ink);outline-offset:1px;position:relative;z-index:1}
.paper{position:absolute;left:262px;top:80px;width:726px;height:546px;border-radius:8px 12px 9px 13px;overflow:hidden}
.paper canvas{width:720px;height:540px;display:block;touch-action:none;cursor:crosshair}
.vrow{position:absolute;left:262px;top:640px;width:726px;display:flex;gap:12px;justify-content:center}
.vrow .btn{flex:1}
.plist{position:absolute;left:1000px;top:80px;width:268px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.btn.pt{min-width:0;height:124px;padding:4px;flex-direction:column;gap:0;font-size:19px;box-shadow:2px 3px 0 var(--ink);line-height:1.15}
.btn.pt canvas{width:100px;height:64px;background:repeating-conic-gradient(#e4e4e8 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:6px}
.btn.pt b{font-weight:normal}.btn.pt span{font-size:14px;opacity:.7}
.btn.pt.on{background:#fff;color:var(--ink);outline:5px solid var(--ink);outline-offset:-1px}
.btn.pt.has span::after{content:'・かいた'}
.scr-draw .donebtn{right:12px;bottom:12px;width:268px;height:66px}

/* くみたて・モーション */
.kprev{position:absolute;left:40px;top:128px;width:680px;height:540px;display:flex;align-items:center;justify-content:center;
  background:repeating-conic-gradient(#eeeef1 0 25%,#fff 0 50%) 0 0/40px 40px}
.kside{position:absolute;left:750px;top:128px;width:500px;display:flex;flex-direction:column;gap:16px}
.klist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.klist .btn{font-size:20px;height:50px}
.pad{display:grid;grid-template-areas:". u ." "l . r" ". d .";grid-template-columns:repeat(3,120px);gap:8px;justify-content:center}
.pad .btn{height:58px;font-size:22px}
.kside .row{justify-content:center}
.mprev{position:absolute;left:40px;top:128px;width:600px;height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.arow{position:absolute;left:40px;top:566px;width:600px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.arow .btn.t.wide{font-size:19px;padding:0 2px;height:60px}
.mlist{position:absolute;left:680px;top:140px;width:520px;display:flex;flex-direction:column;gap:24px;align-items:stretch}
.mlist .btn{height:96px;font-size:40px}

/* せってい */
.setgrid{position:absolute;left:60px;top:110px;width:1160px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.sc{padding:14px 22px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.sc h3{font-size:28px;font-weight:normal;border-bottom:3px dashed var(--ink);padding-bottom:4px}
.sc .btn{height:52px;font-size:24px;align-self:flex-start}

/* パーツが 9こ以上（にそく＋はね・ひれ）のときは ボタンを 小さく */
.plist.many{gap:6px}.plist.many .btn.pt{height:104px}.plist.many .btn.pt canvas{width:78px;height:50px}

/* じゆうパーツ */
.btn.pt.add{border-style:dashed}.plus2{font-style:normal;font-size:44px;line-height:1}.btn.pt.add em{font-style:normal;font-size:14px;opacity:.7}
.kinds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.kinds .btn{min-width:200px}
.kprev canvas{touch-action:none}

/* ===== バトル ===== */
/* じゅんび */
.bsetb{position:absolute;left:50px;top:96px;width:1180px;display:flex;flex-direction:column;gap:14px}
.brow{display:flex;align-items:center;gap:16px}
.brow>span{width:150px;font-size:26px;flex:none;text-align:right}
.brow>div{display:flex;gap:12px;flex-wrap:nowrap}
.btn.bo{min-width:0;width:190px;height:62px;padding:0 6px;font-size:24px}
.btn.bo.w{width:290px}
.btn.bm{min-width:0;width:150px;height:112px;padding:4px;flex-direction:column;gap:0;font-size:20px}
.btn.bm b{font-weight:normal}.btn.bm canvas{width:120px;height:70px}
.btn.bm.on{background:#fff;color:var(--ink);outline:5px solid var(--ink);outline-offset:-1px}
.row.wrap{flex-wrap:wrap;max-width:820px}
/* とく */
.qtime{position:absolute;left:40px;top:18px;width:860px;height:40px;overflow:hidden;padding:0}
.qtime i{display:block;height:100%;width:100%;background:repeating-linear-gradient(-55deg,#111 0 4px,#fff 4px 9px)}
.qleft{position:absolute;left:912px;top:14px;width:160px;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px}
.qcnt{position:absolute;left:1084px;top:14px;width:156px;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px}
.qleft b,.qcnt b{font-size:32px;font-weight:normal;min-width:44px;text-align:center}
.qwho{position:absolute;left:40px;top:74px;font-size:26px}
.qsub{position:absolute;left:540px;top:70px;width:200px;height:44px;display:flex;align-items:center;justify-content:center;font-size:26px}
.btn.qquit{position:absolute;right:40px;top:70px;min-width:110px;height:44px;font-size:20px}
.qbox{position:absolute;left:90px;top:128px;width:1100px;height:214px;display:flex;align-items:center;justify-content:center;padding:14px 40px}
.qbox p{font-family:var(--kyo);font-size:46px;line-height:1.35;text-align:center}
.qbox p.l2{font-size:38px}.qbox p.l3{font-size:31px}
.qch{position:absolute;left:90px;top:362px;width:1100px;display:grid;grid-template-columns:1fr 1fr;gap:22px 30px}
.btn.qc{min-width:0;height:150px;padding:6px 20px;font-family:var(--kyo);font-size:38px;white-space:normal;line-height:1.25;text-align:center}
.btn.qc.l2{font-size:28px}.btn.qc.l3{font-size:22px}
.btn.qc.right{background:var(--ink);color:#fff}.btn.qc.wrong{border-style:dashed;text-decoration:line-through;opacity:.55}.btn.qc.dim{opacity:.3}
.qlock{position:absolute;left:0;right:0;top:60px;display:flex;justify-content:center;pointer-events:none;z-index:5}
.qlock .box{padding:10px 40px;font-size:32px;box-shadow:4px 5px 0 var(--ink)}
.qlock b{font-size:44px;font-weight:normal}
.qready{position:absolute;inset:0;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;z-index:9}
.qready .box{width:420px;height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:5px 6px 0 var(--ink)}
.qready p{font-size:34px}.qready b{font-size:150px;line-height:1;font-weight:normal}
/* みる */
#bcv{position:absolute;left:0;top:0;width:1280px;height:720px}
.hp{position:absolute;top:16px;width:520px;height:104px;padding:6px 18px;display:flex;flex-direction:column;gap:2px}
.hp.l{left:30px}.hp.r{right:30px}
.hp p{display:flex;align-items:baseline;gap:12px;height:34px;overflow:hidden;white-space:nowrap}
.hp p b{font-size:28px;font-weight:normal}.hp p span{font-size:18px;color:#555}
.hpbar{height:26px;border:3px solid var(--ink);border-radius:var(--wob);overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:var(--ink);transition:width .25s}
.hp em{font-style:normal;font-size:20px;text-align:right;height:24px;line-height:24px}
.seek{position:absolute;left:60px;top:636px;width:960px;height:24px;padding:0}
.seek #skfill{position:absolute;left:0;top:0;height:100%;width:0;background:repeating-linear-gradient(-55deg,#111 0 3px,#fff 3px 7px);border-radius:inherit}
.seek #skhead{position:absolute;top:-10px;width:4px;height:38px;margin-left:-2px;background:var(--ink)}
.mk{position:absolute;display:block;margin-left:-8px}
.mk.p{top:-24px;width:16px;height:16px;border-radius:50%;background:var(--ink)}
.mk.e{top:26px;width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid var(--ink);margin-left:-9px}
.sklegend{position:absolute;left:60px;top:684px;display:flex;gap:40px;font-size:18px}
.sklegend span{display:flex;align-items:center;gap:8px}.sklegend .mk{position:static;margin:0}
.btn.spd{position:absolute;right:30px;top:620px;width:200px;height:60px;font-size:24px;min-width:0}
.bend{position:absolute;left:290px;top:138px;width:700px;height:120px;display:flex;align-items:center;justify-content:center;font-size:60px;box-shadow:6px 7px 0 var(--ink)}
/* けっか */
.rhead{position:absolute;left:0;right:0;top:20px;text-align:center;font-size:76px;font-weight:normal}
.rgrid{position:absolute;left:150px;top:140px;width:980px;display:flex;gap:60px}
.rcard{flex:1;height:420px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden}
.rcard.win{box-shadow:6px 7px 0 var(--ink);border-width:5px}
.rcard canvas{width:360px;height:250px}
.rcard h3{font-size:34px;font-weight:normal;line-height:1.2}.rcard p{font-size:22px}.rcard p b{font-size:30px;font-weight:normal}
.rbtns{position:absolute;left:0;right:0;top:590px}
.rnote{position:absolute;left:0;right:0;top:670px;text-align:center}
/* たいせんの じゅんび */
.vcol{position:absolute;top:100px;width:500px;display:flex;flex-direction:column;align-items:center;gap:12px}
.vcol.l{left:50px}.vcol.r{right:50px}
.vcol h3{font-size:34px;font-weight:normal}
.vmons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vmid{position:absolute;left:570px;top:250px;width:140px;text-align:center;font-size:60px;white-space:nowrap}
.vfoe{width:340px;height:256px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px}
.vfoe b{font-weight:normal}.vfoe.empty{border-style:dashed;color:#777;text-align:center}
.vfoe canvas{width:300px;height:200px}
.vmode{position:absolute;left:50px;top:560px}
</style>
</head>

  RG.SHAPE_ORDER = ['slime', 'yotsu', 'tori', 'sakana', 'ekitai', 'robot', 'nisoku'];
  RG.SHAPE_NAMES = { slime: 'スライム', yotsu: 'よつあし', tori: 'とり', sakana: 'さかな', ekitai: 'えきたい', robot: 'ロボット', nisoku: 'にそく' };

  RG.partsFor = function (m) {

    ['みずいろ', '#5ec8ef'], ['あお', '#3a6fe0'], ['むらさき', '#8e55d0'], ['ちゃいろ', '#9a6235'],
  ];
  function hsl2hex(h, sat, l) {
    sat /= 100; l /= 100;
    const k = n => (n + h / 30) % 12, a = sat * Math.min(l, 1 - l);
    const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
    return '#' + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, '0')).join('');
  }
  const PRO = [];
  [['しろ', '#ffffff'], ['グレー1', '#d9d9de'], ['グレー2', '#a9a8b4'], ['グレー3', '#75738a'], ['グレー4', '#4a4862'], ['くろ', '#23213a']].forEach(c => PRO.push(c));
  [['あか', 355], ['オレンジ', 28], ['きいろ', 50], ['みどり', 135], ['あお', 215], ['むらさき', 275]].forEach(([n, h]) => {
    [88, 76, 63, 50, 38, 26].forEach((l, i) => PRO.push([n + (i + 1), hsl2hex(h, h === 50 ? 92 : 82, l)]));
  });
  [['ちゃ1', '#fde3cc'], ['ちゃ2', '#f6cfa6'], ['ちゃ3', '#e0a878'], ['ちゃ4', '#b97a4a'], ['ちゃ5', '#8a5530'], ['ちゃ6', '#5c3820']].forEach(c => PRO.push(c));
  RG.PRO = PRO;
  RG.SIZES = [['ほそい', 3], ['ふつう', 7], ['ふとい', 16]];
  RG.hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  RG.ALL_RGB = [...RG.COLORS, ...PRO].map(c => RG.hexRgb(c[1]));

  // ---- 色 → 教科（SPEC 5-6）----
  // 5教科：国語=赤 / 算数=青 / 社会=黄 / 理科=緑 / 英語=紫。 1・2年：こくご / さんすう / せいかつ1(黄) / せいかつ2(緑)
  RG.SUBJ5 = ['国語', '算数', '社会', '理科', '英語'];
  RG.SUBJ4 = ['こくご', 'さんすう', 'せいかつ1', 'せいかつ2'];
  // 色相の めじるし（度）と 教科の番号
  const ANCH5 = [[0, 0], [55, 2], [135, 3], [215, 1], [275, 4], [360, 0]];
  const ANCH4 = [[0, 0], [55, 2], [135, 3], [215, 1], [360, 0]];
  function split(h, anch, out) {
    for (let i = 0; i < anch.length - 1; i++) {
      const [a, sa] = anch[i], [b, sb] = anch[i + 1];
      if (h >= a && h <= b) {
        // めじるしの近く（はばの15%）は その教科に 全部。あいだは 近さで 分ける
        const t = Math.max(0, Math.min(1, ((h - a) / (b - a) - 0.15) / 0.7));
        out[sa] += 1 - t; out[sb] += t; return;
      }
    }
  }
  // パーツのキャンバスたちから 色の割合（千分率）を 出す。色みのない色（黒・白・灰）は 数えない
  RG.colorRatio = function (canvases) {
    const s5 = [0, 0, 0, 0, 0], s4 = [0, 0, 0, 0];
    for (const cv of canvases) {
      if (!cv) continue;
      const d = cv.getContext('2d').getImageData(0, 0, cv.width, cv.height).data;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] < 128) continue;
        const r = d[i], g = d[i + 1], b = d[i + 2], mx = Math.max(r, g, b), mn = Math.min(r, g, b), c = mx - mn;
        if (c < 51) continue;
        let h = mx === r ? ((g - b) / c) % 6 : mx === g ? (b - r) / c + 2 : (r - g) / c + 4;
        h = (h * 60 + 360) % 360;
        split(h, ANCH5, s5); split(h, ANCH4, s4);
      }
    }
    return { r5: permille(s5), r4: permille(s4) };
  };
  function permille(a) {
    const sum = a.reduce((x, y) => x + y, 0);
    if (!sum) return a.map(() => 0);
    const o = a.map(v => Math.floor(v * 1000 / sum));
    let rest = 1000 - o.reduce((x, y) => x + y, 0), i = o.indexOf(Math.max(...o));
    o[i] += rest; return o;
  }
  // 学年に合わせた 属性値（合計1000）。色みなしは 等分
  RG.stats = function (mon, grade) {
    const four = grade <= 2, r = four ? mon.r4 : mon.r5, names = four ? RG.SUBJ4 : RG.SUBJ5;
    const sum = r.reduce((x, y) => x + y, 0);
    const v = sum ? r : names.map(() => 1000 / names.length);
    return names.map((n, i) => ({ name: n, v: Math.round(v[i]) }));
  };

  // ---- くみたて（パーツの ならべかた）----
  // かえり値：描く順の [{p, x, y}]（みぎむきの座標。どうの左上が 0,0）と 全体の はんい
  RG.layout = function (m, has) {
    const parts = RG.partsFor(m), adj = m.adj, pos = {}, order = [], byId = id => parts.find(q => q.id === id);
    const place = p => {
      if (pos[p.id]) return pos[p.id];
      if (!p.parent) return (pos[p.id] = [0, 0]);
      const pp = place(byId(p.parent)), a = (!p.free && adj && adj[p.id]) || [0, 0];
      return (pos[p.id] = [pp[0] + p.pj[0] + a[0] - p.cj[0], pp[1] + p.pj[1] + a[1] - p.cj[1]]);
    };
    const zOf = p => { const a = !p.free && adj && adj[p.id]; return a && a[2] != null ? a[2] : p.z; };
    const emit = p => {
      const kids = parts.filter(c => c.parent === p.id && (!has || has(c.id)));
      kids.filter(c => !zOf(c)).forEach(emit);
      if (!has || has(p.id)) order.push({ p, x: place(p)[0], y: place(p)[1] });
      kids.filter(c => zOf(c)).forEach(emit);
    };
    parts.filter(p => !p.parent).forEach(emit);
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    order.forEach(o => { x0 = Math.min(x0, o.x); y0 = Math.min(y0, o.y); x1 = Math.max(x1, o.x + o.p.w); y1 = Math.max(y1, o.y + o.p.h); });
    return { order, x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  };

  // opt.flip＝左右反転して表示／opt.pose＝うごき（RG.pose の かえり値）／opt.maxScale
  // みぎむきの座標で 組み立て、ひだりむきの絵は 全体を うらがえして 描く（回転も いっしょに うらがえる）
  RG.drawMon = function (ctx, m, get, bx, by, bw, bh, opt) {
    opt = opt || {};
    const has = pid => !!get(pid), L = RG.layout(m, has);
    if (!L.order.length) return null;
    const s = Math.min(bw / L.w, bh / L.h, opt.maxScale || 9), left = m.face === 1, pose = opt.pose || null;
    const ox = bx + (bw - L.w * s) / 2, oy = by + (bh - L.h * s) / 2, parts = RG.partsFor(m);
    const zOf = p => { const a = !p.free && m.adj && m.adj[p.id]; return a && a[2] != null ? a[2] : p.z; };
    ctx.save();
    if (opt.flip) { ctx.translate(bx * 2 + bw, 0); ctx.scale(-1, 1); }
    ctx.translate(ox, oy); ctx.scale(s, s);
    if (left) { ctx.translate(L.w, 0); ctx.scale(-1, 1); }
    ctx.translate(-L.x0, -L.y0);
    const draw = p => {
      ctx.save();
      if (p.parent) {
        const a = (!p.free && m.adj && m.adj[p.id]) || [0, 0];
        ctx.translate(p.pj[0] + a[0], p.pj[1] + a[1]);
        if (pose && pose.parts[p.id]) ctx.rotate(pose.parts[p.id]);
        ctx.translate(-p.cj[0], -p.cj[1]);
      } else if (pose) {
        // からだ全体：足もとを じくに のびちぢみ・かたむき
        const px = p.w / 2, py = p.h * 0.92;
        ctx.translate(pose.dx + px, pose.dy + py); ctx.rotate(pose.rot); ctx.scale(pose.sx, pose.sy); ctx.translate(-px, -py);
      }
      const kids = parts.filter(c => c.parent === p.id && has(c.id));
      kids.filter(c => !zOf(c)).forEach(draw);
      if (has(p.id)) {
        if (left) { ctx.save(); ctx.translate(p.w, 0); ctx.scale(-1, 1); ctx.drawImage(get(p.id), 0, 0); ctx.restore(); }
        else ctx.drawImage(get(p.id), 0, 0);
      }
      kids.filter(c => zOf(c)).forEach(draw);
      ctx.restore();
    };
    parts.filter(p => !p.parent).forEach(draw);
    ctx.restore();
    return { s, ox, oy, L };
  };
  // むきに 合わせた 関節の位置
  RG.jx = (p, pt, face) => face === 1 ? [p.w - pt[0], pt[1]] : pt;
})(window.RG);

        if (!inkAt(P[p.id], RG.jx(p, p.cj, E.face))) miss.push({ pid: p.id, key: p.id + '>' + p.id, text: `「${p.name}」の まるの なかに かこう` });
        if (!inkAt(P[par.id], RG.jx(par, p.pj, E.face))) miss.push({ pid: par.id, key: p.id + '>' + par.id, text: `「${par.name}」の「${p.name}」と つながる まるの なかに かこう` });
      }
      return miss;
    };
    E.blink = function (miss) {
      const m = miss[0]; E.cur = m.pid;
      blink = { keys: miss.filter(x => x.pid === m.pid).map(x => x.key), t0: performance.now(), until: performance.now() + 2600 };
      render();
    };
    // できあがった パーツ（描いたものだけ）を、あたらしい キャンバスで わたす
    E.result = function () {
      const out = {};
      for (const p of PARTS()) if (P[p.id].ink) { const c = mk(p.w, p.h); c.getContext('2d').drawImage(P[p.id].cv, 0, 0); out[p.id] = c; }
      return out;
    };
    render();
  };
})(window.RG);

</script>
<script>
// ===== 画面（タイトル・はじめて設定・ホーム・キャラクター・つくる・せってい） =====
(function (RG) {
  'use strict';
  const stage = document.getElementById('stage');
  const SAVE_KEY = 'rakugaki_save_v1';
  const mk = RG.mkCanvas;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---- セーブ ----
  let S = { v: 1, player: null, mons: [], se: true };
  const CACHE = {};   // モンスターID → {pid: canvas}
  function load() { try { const t = localStorage.getItem(SAVE_KEY); if (t) { const o = JSON.parse(t); if (o && o.v === 1) S = o; } } catch (e) { } }
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); return true; } catch (e) { toast('ほぞん できなかったよ。PNGで だしておいてね'); return false; } }
  const imgCanvas = url => new Promise(res => { const im = new Image(); im.onload = () => { const c = mk(im.naturalWidth, im.naturalHeight); c.getContext('2d').drawImage(im, 0, 0); res(c); }; im.onerror = () => res(null); im.src = url; });
  async function cacheMon(m) { const o = {}; for (const pid in m.parts) { const c = await imgCanvas(m.parts[pid]); if (c) o[pid] = c; } CACHE[m.id] = o; }
  const getter = m => pid => (CACHE[m.id] || {})[pid] || null;
  const isMine = m => S.player && m.creator.id === S.player.id;
  RG.isOpen = k => !!(S.player && S.player.shapes.includes(k));

  // ---- 画面の大きさ（16:9 固定。1280×720 を 拡大縮小）----
  function fit() {
    const s = Math.min(innerWidth / 1280, innerHeight / 720);
    stage.style.transform = `translate(${(innerWidth - 1280 * s) / 2}px,${(innerHeight - 720 * s) / 2}px) scale(${s})`;
  }
  addEventListener('resize', fit); addEventListener('orientationchange', fit); fit();

  // ---- おと ----
  let seAudio = null;
  function se() {
    if (!S.se || !RG.ASSETS || !RG.ASSETS.decide) return;
    try { seAudio = seAudio || new Audio(RG.ASSETS.decide); const a = seAudio.cloneNode(); a.volume = 0.5; a.play().catch(() => { }); } catch (e) { }
  }

  // ---- 画面の 切りかえ ----
  let acts = {};

  });
  // 事故防止（長おしメニュー・ピンチ・ダブルタップ拡大）
  addEventListener('contextmenu', e => { if (!e.target.closest('.savable')) e.preventDefault(); });
  document.addEventListener('gesturestart', e => e.preventDefault());
  let lastTouch = 0; document.addEventListener('touchend', e => { const n = Date.now(); if (n - lastTouch < 320 && !e.target.closest('input')) e.preventDefault(); lastTouch = n; }, { passive: false });
  addEventListener('beforeunload', e => { if (RG.making) { e.preventDefault(); e.returnValue = ''; } });

  // おえかき中の キーボード：Ctrl+Z＝もどす、Ctrl+Y・Ctrl+Shift+Z＝すすむ
  addEventListener('keydown', e => {
    if (RG.screen !== 'draw' || !RG.ed || stage.querySelector('.modal') || !(e.ctrlKey || e.metaKey)) return;
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); RG.ed.undo(); }
    else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); RG.ed.redo(); }
  });

  // ---- ふきだし・まど ----
  let modalActs = null;
  function modal(html, handlers) {
    closeModal(); const d = document.createElement('div'); d.className = 'modal'; d.innerHTML = `<div class="box mbox">${html}</div>`;
    stage.appendChild(d); modalActs = handlers || {};
  }
  function closeModal() { const m = stage.querySelector('.modal'); if (m) m.remove(); modalActs = null; }
  const ask = (text, yes, no) => new Promise(res => modal(`<p class="mtext">${text}</p><div class="row c"><button class="btn" data-a="n">${no || 'やめる'}</button><button class="btn strong" data-a="y">${yes || 'はい'}</button></div>`, { y() { closeModal(); res(true); }, n() { closeModal(); res(false); } }));
  const tell = text => new Promise(res => modal(`<p class="mtext">${text}</p><div class="row c"><button class="btn strong" data-a="y">わかった</button></div>`, { y() { closeModal(); res(); } }));
  let toastT = 0;
  function toast(text) {
    let t = stage.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast box'; stage.appendChild(t); }
    t.textContent = text; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
  }
  // えふでちゃん（かりの 線画。あとで K.nom の絵に 入れかえる）
  const EFUDE = `<svg class="efude" viewBox="0 0 100 120"><g fill="#fff" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M38 8 L62 8 L60 50 L40 50 Z"/><path d="M36 50 L64 50 L66 62 L34 62 Z"/><path d="M34 62 Q28 86 40 100 Q50 116 54 100 Q74 90 66 62 Z"/></g><g fill="#111"><circle cx="43" cy="78" r="3.4"/><circle cx="58" cy="78" r="3.4"/></g><path d="M45 88 Q51 94 57 88" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/></svg>`;
  const guide = text => `<div class="guide">${EFUDE}<div class="box bubble" id="hint">${text}</div></div>`;
  const pickFile = () => new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.style.display = 'none';
    i.onchange = () => { res(i.files[0] || null); i.remove(); }; i.oncancel = () => { res(null); i.remove(); }; document.body.appendChild(i); RG.lastInput = i; i.click();
  });
  // PNGを 見せて、ほぞんする
  function showPNG(cv, fname, title) {
    return new Promise(res => {
      modal(`<p class="mtext s">${title}</p><img class="pngview savable" alt=""><p class="note">ほぞん できない ときは、がぞうを ながおし（みぎクリック）して ほぞんしてね</p>
        <div class="row c"><button class="btn" data-a="n">とじる</button><button class="btn strong" data-a="y">ほぞんする</button></div>`,
        { async y() { await RG.download(cv, fname); toast('ほぞんしたよ'); }, n() { closeModal(); res(); } });
      stage.querySelector('.pngview').src = cv.toDataURL('image/png');
    });
  }
  const fileName = m => `rakugaki_${m.name}_${(m.id >>> 0).toString(16)}.png`;

  // ---- アイコン（お絵描きリレーと 同じ 線画）----
  const svg = (d, w) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w || 2.4}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const IC = {
    pen: svg('<path d="M4 20l1.2-4.6L16 4.6a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14 6.6l3.4 3.4"/>'),
    eraser: svg('<path d="M8.5 20H20"/><path d="M5.2 15.8l9.6-9.6a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L12 19.1a3 3 0 0 1-4.2 0l-2.6-2.6a.5.5 0 0 1 0-.7z"/><path d="M9.5 11.5l5 5"/>'),
    fill: svg('<path d="M10.2 3.8l8 8-6.6 6.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8z"/><path d="M4.2 11.6h13.6"/><path d="M8 5.6L6.2 3.8"/><path d="M20.5 15.5c.9 1.3 1.4 2.2 1.4 2.9a1.4 1.4 0 0 1-2.8 0c0-.7.5-1.6 1.4-2.9z"/>'),
    undo: svg('<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>', 2.6),
    redo: svg('<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>', 2.6),
    clear: svg('<path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l1 13h9l1-13"/><path d="M10 11v5.5M14 11v5.5"/>'),
    penonly: svg('<path d="M12 3v11"/><path d="M9 14h6l-3 7z"/><path d="M9.5 3h5"/>'),
    pal: svg('<path d="M12 3.5a8.5 8.5 0 1 0 0 17c1.4 0 2-1 1.6-2.1-.5-1.3.3-2.4 1.7-2.4h1.9a3.3 3.3 0 0 0 3.3-3.3C20.500 7.600 16.700 3.500 12 3.500z"/><circle cx="8" cy="11" r=".9"/><circle cx="11" cy="7.500" r=".9"/><circle cx="15.500" cy="8.500" r=".9"/>'),
    single: svg('<rect x="6" y="6" width="12" height="12" rx="2"/>'),
    multi: svg('<rect x="3.500" y="9" width="8" height="8" rx="1.500"/><rect x="12.500" y="5" width="8" height="8" rx="1.500"/><path d="M11.500 12h1"/>'),
    guide: svg('<rect x="4" y="4" width="16" height="16" rx="3" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="3"/>'),
  };

  // ---- かな入力（ひらがな・カタカナのみ。画面のボタンでも キーボードでも）----
  // ローマ字 → かな（日本語入力が オフのとき用）
  const ROMA = (() => {
    const t = { a: 'あ', i: 'い', u: 'う', e: 'え', o: 'お', '-': 'ー', nn: 'ん', wa: 'わ', wo: 'を', ya: 'や', yu: 'ゆ', yo: 'よ', shi: 'し', chi: 'ち', tsu: 'つ', fu: 'ふ', ji: 'じ', vu: 'ゔ',
      sha: 'しゃ', shu: 'しゅ', sho: 'しょ', cha: 'ちゃ', chu: 'ちゅ', cho: 'ちょ', ja: 'じゃ', ju: 'じゅ', jo: 'じょ',
      xa: 'ぁ', xi: 'ぃ', xu: 'ぅ', xe: 'ぇ', xo: 'ぉ', la: 'ぁ', li: 'ぃ', lu: 'ぅ', le: 'ぇ', lo: 'ぉ', xtu: 'っ', ltu: 'っ', xya: 'ゃ', xyu: 'ゅ', xyo: 'ょ' };
    const rows = { k: 'かきくけこ', s: 'さしすせそ', t: 'たちつてと', n: 'なにぬねの', h: 'はひふへほ', m: 'まみむめも', r: 'らりるれろ', g: 'がぎぐげご', z: 'ざじずぜぞ', d: 'だぢづでど', b: 'ばびぶべぼ', p: 'ぱぴぷぺぽ' };
    for (const c in rows) { [...'aiueo'].forEach((v, i) => { t[c + v] = rows[c][i]; }); [['a', 'ゃ'], ['u', 'ゅ'], ['o', 'ょ']].forEach(([v, y]) => { t[c + 'y' + v] = rows[c][1] + y; }); }
    return t;
  })();
  // 入力された文字を ひらがな・カタカナ だけに する。さいごの 打ちかけの ローマ字は のこす
  function kanaFilter(raw, kata) {
    let out = '', i = 0; const str = raw.toLowerCase().replace(/[Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).replace(/[ｰ－―‐]/g, 'ー');
    const conv = k => (kata ? toKata(k) : k);
    while (i < str.length) {
      const c = str[i];
      if (/[ぁ-ゖァ-ヶー]/.test(c)) { out += c; i++; continue; }
      if (!/[a-z\-]/.test(c)) { i++; continue; }
      let hit = false;
      for (const n of [3, 2, 1]) { const k = ROMA[str.substr(i, n)]; if (k && str.substr(i, n).length === n) { out += conv(k); i += n; hit = true; break; } }
      if (hit) continue;
      const nx = str[i + 1];
      if (c === 'n' && nx && !/[aiueoyn]/.test(nx)) { out += conv('ん'); i++; continue; }
      if (nx && c === nx && /[kstnhmrgzdbpcjfwy]/.test(c) && c !== 'n') { out += conv('っ'); i++; continue; }
      // 打ちかけ（つづきが まだ ない）は のこす。つづきが あるのに かなに ならない文字は すてる
      const rest = str.slice(i); if (/^[a-z]{1,3}$/.test(rest)) return { kana: out, pend: rest };
      i++;
    }
    return { kana: out, pend: '' };
  }
  const K_ROWS = ['あかさたなはまやらわ', 'いきしちにひみ　りを', 'うくすつぬふむゆるん', 'えけせてねへめ　れー', 'おこそとのほもよろ　'];
  const DK_A = 'かきくけこさしすせそたちつてとはひふへほう', DK_B = 'がぎぐげござじずぜぞだぢづでどばびぶべぼゔ';
  const HD_A = 'はひふへほ', HD_B = 'ぱぴぷぺぽ', SM_A = 'あいうえおつやゆよわ', SM_B = 'ぁぃぅぇぉっゃゅょゎ';
  const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
  const toHira = s => s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  function kanaHTML(val) {
    return `<div class="namebox box"><input id="kin" type="text" inputmode="kana" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="なまえ"></div><div class="kana">` +
      K_ROWS.map(r => [...r].map(ch => ch === '　' ? '<i></i>' : `<button class="btn k" data-a="k" data-c="${ch}">${ch}</button>`).join('')).join('') +
      `</div><div class="row kctl"><button class="btn" data-a="kmode" id="kmode">カタカナ</button><button class="btn" data-a="kd">゛</button><button class="btn" data-a="kh">゜</button><button class="btn" data-a="ks">ちいさく</button><button class="btn" data-a="kb">けす</button></div>`;
  }
  function kanaActs(K, max) {
    let composing = false;
    const draw = keepInput => {
      const inp = document.getElementById('kin'); if (!inp) return;
      if (!keepInput) inp.value = K.val;
      document.querySelectorAll('.k').forEach(b => { b.textContent = K.kata ? toKata(b.dataset.c) : b.dataset.c; });
      document.getElementById('kmode').textContent = K.kata ? 'ひらがな' : 'カタカナ';
      if (K.onChange) K.onChange();
    };
    // キーボード入力：日本語入力の とちゅう（変換中）は さわらない
    const fromInput = () => {
      const inp = document.getElementById('kin'), r = kanaFilter(inp.value, K.kata);
      K.val = [...r.kana].slice(0, max).join('');
      const v = K.val + ([...K.val].length < max ? r.pend : '');
      if (inp.value !== v) inp.value = v;
      draw(true);
    };
    setTimeout(() => {
      const inp = document.getElementById('kin'); if (!inp) return;
      inp.addEventListener('compositionstart', () => { composing = true; });
      inp.addEventListener('compositionend', () => { composing = false; fromInput(); });
      inp.addEventListener('input', () => { if (!composing) fromInput(); });
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !composing && !e.isComposing) { e.preventDefault(); inp.value += ' '; fromInput(); inp.value = K.val; const ok = document.getElementById('ok'); if (ok && !ok.classList.contains('off')) ok.click(); } });
      inp.addEventListener('blur', () => { if (!composing) { inp.value += ' '; fromInput(); inp.value = K.val; } });   // うちかけの「n」は「ん」に
      // キーボードが つながっている 端末では、そのまま 打ちはじめられるように
      if (matchMedia('(hover: hover) and (pointer: fine)').matches) inp.focus();
    }, 0);
    const swap = (A, B) => {
      if (!K.val) return; const last = K.val.slice(-1), kata = /[ァ-ヶ]/.test(last), h = toHira(last);
      let i = A.indexOf(h), r = i >= 0 ? B[i] : (i = B.indexOf(h)) >= 0 ? A[i] : null;
      if (!r && A === HD_A && (i = 'ばびぶべぼ'.indexOf(h)) >= 0) r = HD_B[i];
      if (!r && A === DK_A && (i = HD_B.indexOf(h)) >= 0) r = 'ばびぶべぼ'[i];
      if (r) { K.val = K.val.slice(0, -1) + (kata ? toKata(r) : r); draw(); }
    };
    setTimeout(draw, 0);
    return {
      k(b) { if ([...K.val].length >= max) return; K.val += K.kata ? toKata(b.dataset.c) : b.dataset.c; draw(); },
      kmode() { K.kata = !K.kata; draw(); }, kd() { swap(DK_A, DK_B); }, kh() { swap(HD_A, HD_B); }, ks() { swap(SM_A, SM_B); },
      kb() { K.val = K.val.slice(0, -1); draw(); },
    };
  }

  // =============== タイトル ===============
  function title() {
    show('title', `<div class="tlogo"><div class="box tl1">らくがき</div><div class="tl2">学習バトル</div></div>
      <div class="col c tbtns"><button class="btn big strong" data-a="go">はじめる</button><button class="btn" data-a="load">データよみこみ</button></div>
      <div class="ver">ver ${RG.VERSION}</div>`, {
      go() { S.player ? home() : setupName(); },
      async load() {
        const f = await pickFile(); if (!f) return;
        const p = RG.readPlayerPNG(await RG.fileToCanvas(f));
        if (S.player && !(await ask(`いまの データ（${esc(S.player.name)}）を「${esc(p.name)}」の データに かえるよ。いい？<br><span class="note">モンスターは そのまま のこるよ</span>`))) return;
        S.player = p; save(); await tell(`「${esc(p.name)}」の データを よみこんだよ。<br><span class="note">モンスターは 1たいずつ PNGから よみこんでね</span>`); home();
      },
    });
  }

  // =============== はじめて設定 ===============
  function setupName() {
    const K = { val: '', kata: false };
    K.onChange = () => { document.getElementById('ok').classList.toggle('off', !K.val); };
    show('setup', guide('はじめまして！ わたしは えふでちゃん。<br>あなたの なまえを おしえてね（6もじまで）') + kanaHTML() + `<button class="btn strong off okbtn" id="ok" data-a="ok">これで きまり</button>`,
      Object.assign(kanaActs(K, 6), { ok() { setupGrade(K.val); } }));
  }
  function setupGrade(name, editing) {
    show('grade', guide(editing ? 'なんねんせいに かえる？' : `${esc(name)}さん、よろしくね！<br>いま なんねんせい？`) +
      `<div class="grades">${[1, 2, 3, 4, 5, 6].map(g => `<button class="btn big g" data-a="g" data-g="${g}">${g}ねんせい</button>`).join('')}</div>` +
      (editing ? `<button class="btn backbtn" data-a="back">もどる</button>` : ''), {
      g(b) {
        const g = +b.dataset.g;
        if (editing) { S.player.grade = g; save(); settings(); return; }
        S.player = { name, id: RG.newId(), grade: g, coins: 0, gems: [], shapes: ['slime'], slots: 1, day: 0, doneA: 0, doneB: 0, bonus: 0, tutorial: false };
        save(); tutorialIntro();
      },
      back() { settings(); },
    });
  }
  function tutorialIntro() {
    show('intro', guide('この せかいでは、じぶんで かいた モンスターが たたかうよ。<br>まずは いっしょに「スライム」を つくってみよう！') +
      `<button class="btn big strong okbtn" data-a="go">つくってみる</button>`, { go() { startMake({ shape: 'slime', tutorial: true }); } });
  }

  // =============== ホーム ===============
  function home() {
    RG.making = false;
    if (S.player && !S.player.tutorial && !S.mons.length) return tutorialIntro();
    show('home', `<div class="hname box">${esc(S.player.name)}　${S.player.grade}ねんせい</div><div class="hcoin box">コイン　${S.player.coins}</div>
      <div class="hbig"><button class="btn huge" data-a="prac"><b>まいにち れんしゅう</b><span>コンピューターと たたかう</span></button><button class="btn huge" data-a="vs"><b>ともだちと たいせん</b><span>1だいで ふたりで あそぶ</span></button></div>
      <div class="hsmall"><button class="btn" data-a="chars">キャラクター</button><button class="btn" data-a="soon">ほうせき</button><button class="btn" data-a="soon">おみせ</button><button class="btn" data-a="set">せってい</button></div>`, {
      chars() { chars(); }, set() { settings(); }, prac() { RG.battle.practice(); }, vs() { RG.battle.versus(); }, soon() { toast('ここは いま つくっているよ。もうすこし まってね'); },
    });
  }

  // =============== キャラクター ===============
  function chars() {
    RG.making = false;
    const cards = [];
    for (let i = 0; i < 6; i++) {
      const m = S.mons[i];
      if (m) cards.push(`<button class="btn card" data-a="open" data-i="${i}"><canvas width="340" height="190" data-mon="${i}"></canvas><b>${esc(m.name)}</b></button>`);
      else if (i < S.player.slots) cards.push(`<button class="btn card empty" data-a="make"><span class="plus">＋</span><b>つくる</b></button>`);
      else cards.push(`<div class="card locked box"><b>かくちょう</b><span>おみせで かえるよ</span></div>`);
    }
    show('chars', `<h1 class="ttl">キャラクター</h1><button class="btn backbtn" data-a="back">もどる</button>
      <div class="cards">${cards.join('')}</div>
      <div class="row c foot"><button class="btn" data-a="imp">PNGを よみこむ</button><button class="btn" data-a="all">ぜんぶ まとめて だす</button></div>`, {
      back() { home(); }, open(b) { detail(S.mons[+b.dataset.i]); }, make() { pickShape(); }, imp() { importMon(); }, all() { exportAll(); },
    });
    stage.querySelectorAll('canvas[data-mon]').forEach(c => { const m = S.mons[+c.dataset.mon]; RG.drawMon(c.getContext('2d'), m, getter(m), 6, 6, 328, 178, { maxScale: 1 }); });
  }
  async function importMon() {
    const f = await pickFile(); if (!f) return;
    const r = RG.readMonPNG(await RG.fileToCanvas(f)), q = r.mon;
    const old = S.mons.findIndex(m => m.id === q.id);
    if (old >= 0) { if (!(await ask(`「${esc(S.mons[old].name)}」は もう いるよ。うわがき する？`))) return; }
    else if (S.mons.length >= S.player.slots) return tell('わくが いっぱいだよ。<br>どれかを PNGで だしてから にがしてね');
    const m = { id: q.id, name: q.name, shape: q.shape, face: q.face, parts: {}, adj: q.adj, free: q.free || {}, motion: q.motion, gems: [0, 0, 0], r5: q.r5, r4: q.r4, creator: q.creator, grade: q.grade, date: q.date };
    for (const pid in r.parts) m.parts[pid] = r.parts[pid].toDataURL('image/png');
    CACHE[m.id] = r.parts;
    if (old >= 0) S.mons[old] = m; else S.mons.push(m);
    save();
    const notes = [];
    if (r.blurry) notes.push('すこし ぼやけて よみこんだよ');
    if (q.gems.some(g => g)) notes.push('ほうせきは はずれたよ');
    if (!isMine(m)) notes.push(`うみのおやは ${esc(m.creator.name)}さん。えは なおせないよ`);
    await tell(`「${esc(m.name)}」が なかまに なったよ！` + (notes.length ? `<br><span class="note">${notes.join('<br>')}</span>` : ''));
    chars();
  }
  async function exportAll() {

    for (const m of S.mons) { await RG.download(RG.buildMonPNG(m, getter(m)), fileName(m)); await new Promise(r => setTimeout(r, 500)); }

  function statsHTML(m) {

  // =============== キャラクターを つくる ===============
  let D = null;   // つくっている とちゅうの データ

  function pickFace() {

      `<div class="faces"><button class="btn big fc" data-a="f" data-f="1"><span class="arrow">←</span><b>ひだりむき</b></button><button class="btn big fc" data-a="f" data-f="0"><span class="arrow">→</span><b>みぎむき</b></button></div>`,
      { back() { RG.making = false; pickShape(); }, f(b) { D.face = +b.dataset.f; drawScreen(); } });
